# This workflow scrapes standings data from Wikipedia and update the corresponding JSON file.
name: Group standings scraper

# Cron job time
on:
  schedule:
    - cron: "0 8 * * *" # Every day at 08:00 UTC = 16:00 AEST
  workflow_dispatch: # Allows manual triggering of the workflow
  push:
    branches:
      - main # Triggers on push to the main branch

# Jobs specification
jobs:
  build:
    runs-on: ubuntu-latest

    # Steps to execute
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up Python 3.14
        uses: actions/setup-python@v2
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run group standing scrapers
        run: |
          python python/scrapers/standings.py

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git diff-index --quiet HEAD || (git commit -a -m "Update group standings" --allow-empty)

      - name: Push changes to main branch
        run: |
          git push origin HEAD:main --force
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
